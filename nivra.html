<style>
:root{
  --color-ink:#f0f0f5;--color-ink-muted:#8e8ea0;--color-surface:#12121a;
  --color-surface-2:#1a1a26;--color-surface-3:#22222f;--color-border:#2a2a3a;
  --color-accent:#6c5ce7;--color-accent-light:#a29bfe;--color-success:#00cec9;
  --color-danger:#ff6b6b;--color-warning:#fdcb6e;
  --radius-sm:8px;--radius-md:16px;--radius-lg:24px;--radius-xl:32px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body,#root{height:100%;width:100%;overflow:hidden}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:var(--color-surface);color:var(--color-ink);
  -webkit-font-smoothing:antialiased;touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
::selection{background:var(--color-accent);color:#fff}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--color-border);border-radius:4px}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes onlinePulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes lockPulse{0%,100%{box-shadow:0 0 40px rgba(108,92,231,.4),0 0 80px rgba(108,92,231,.2)}50%{box-shadow:0 0 50px rgba(108,92,231,.5),0 0 100px rgba(108,92,231,.3)}}
@keyframes ambientGlow{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(-5%,-5%) rotate(3deg)}}
@keyframes messageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.app{height:100%;width:100%;display:flex;flex-direction:column;background:var(--color-surface);overflow:hidden}
/* Inputs & buttons */
.input-field{width:100%;padding:14px 16px;background:var(--color-surface-2);border:1px solid var(--color-border);border-radius:var(--radius-md);color:var(--color-ink);font-size:16px;outline:none;transition:all .2s}
.input-field:focus{border-color:var(--color-accent);box-shadow:0 0 0 3px rgba(108,92,231,.2)}
.input-field::placeholder{color:var(--color-ink-muted)}
.input-field:disabled{opacity:.6;cursor:not-allowed}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 24px;border-radius:var(--radius-md);font-size:16px;font-weight:600;cursor:pointer;transition:all .2s;border:none;outline:none;width:100%;user-select:none}
.btn-primary{background:var(--color-accent);color:#fff}
.btn-primary:hover{background:#5b4bd6;transform:translateY(-1px)}
.btn-primary:active{transform:translateY(0)}
.btn-primary:disabled{opacity:.6;cursor:not-allowed;transform:none}
.divider{height:1px;background:var(--color-border);margin:16px 0}
.avatar-ring{padding:3px;background:var(--color-accent);border-radius:50%;display:flex;align-items:center;justify-content:center}
.avatar-placeholder{display:flex;align-items:center;justify-content:center;background:var(--color-surface-3);color:var(--color-ink-muted);font-weight:600;border-radius:50%}
.spinner{width:20px;height:20px;animation:spin 1s linear infinite}
.spinner-sm{width:18px;height:18px;animation:spin 1s linear infinite}
.btn-loading{display:flex;align-items:center;justify-content:center;gap:10px;color:#fff}
/* Lock screen */
.lock-screen{height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#0a0a0f 0%,#1a1a2e 50%,#16213e 100%);padding:24px;position:relative;overflow:hidden}
.lock-screen::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle at 30% 20%,rgba(108,92,231,.08) 0,transparent 50%),radial-gradient(circle at 70% 80%,rgba(0,206,201,.05) 0,transparent 50%);animation:ambientGlow 20s ease-in-out infinite alternate}
.lock-content{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:24px;width:100%;max-width:340px}
.lock-icon-wrapper{width:80px;height:80px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#6c5ce7,#a29bfe);border-radius:50%;animation:lockPulse 3s ease-in-out infinite}
.lock-icon{width:40px;height:40px;color:#fff}
.lock-title{font-size:28px;font-weight:700;letter-spacing:4px;text-transform:uppercase}
.lock-subtitle{font-size:15px;color:var(--color-ink-muted);text-align:center}
.passcode-display{display:flex;gap:12px;margin:8px 0}
.passcode-dot{width:12px;height:12px;border-radius:50%;background:var(--color-surface-3);border:2px solid var(--color-border);transition:all .2s}
.passcode-dot.filled{background:var(--color-accent);border-color:var(--color-accent);box-shadow:0 0 12px rgba(108,92,231,.5)}
.passcode-input{width:200px;text-align:center;font-size:28px;font-weight:600;letter-spacing:8px;background:transparent;border:none;color:var(--color-ink);outline:none;caret-color:var(--color-accent)}
.passcode-input::placeholder{color:var(--color-border);letter-spacing:4px}
.attempt-warning{font-size:12px;color:var(--color-warning);margin-top:8px}
.error-message{font-size:14px;color:var(--color-danger);text-align:center;margin-top:12px;animation:shake .4s}
.security-note{font-size:11px;color:var(--color-ink-muted);margin-top:16px;text-align:center;opacity:.7}
.unlock-btn{margin-top:8px}

.auth-screen{height:100%;display:flex;flex-direction:column;justify-content:center;padding:32px 24px;background:linear-gradient(160deg,#0a0a0f 0%,#1a1a2e 50%,#16213e 100%)}
.auth-content{max-width:400px;margin:0 auto;width:100%}
.auth-header{display:flex;flex-direction:column;align-items:center;gap:16px;margin-bottom:24px}
.auth-logo{width:64px;height:64px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#6c5ce7,#a29bfe);border-radius:16px;box-shadow:0 0 30px rgba(108,92,231,.3)}
.auth-logo svg{width:32px;height:32px;color:#fff}
.auth-title{font-size:24px;font-weight:700;letter-spacing:2px}
.auth-subtitle{font-size:14px;color:var(--color-ink-muted)}
.auth-form{display:flex;flex-direction:column;gap:20px}
.form-group{display:flex;flex-direction:column;gap:8px}
.form-label{font-size:13px;font-weight:500;color:var(--color-ink-muted);text-transform:uppercase;letter-spacing:.5px}
.label-row{display:flex;justify-content:space-between;align-items:center}
.link-btn{background:none;border:none;color:var(--color-accent-light);font-size:14px;cursor:pointer;padding:0}

.input-wrapper{position:relative}
.input-wrapper .input-field{padding-right:48px}
.toggle-pw{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--color-ink-muted);padding:4px;cursor:pointer;display:flex}
.toggle-pw:disabled{opacity:.4;cursor:not-allowed}
.toggle-pw svg{width:20px;height:20px}
.form-options{display:flex;justify-content:space-between;align-items:center}
.checkbox-label{display:flex;align-items:center;gap:8px;cursor:pointer}
.checkbox{width:16px;height:16px;accent-color:var(--color-accent)}
.checkbox-text{font-size:13px;color:var(--color-ink-muted)}
.submit-btn{margin-top:8px}
.error-banner{display:flex;align-items:center;gap:10px;padding:12px 16px;background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.3);border-radius:var(--radius-md);color:var(--color-danger);font-size:14px}
.error-banner svg{width:18px;height:18px;flex-shrink:0}
.auth-helper{margin-top:24px;padding-top:16px;border-top:1px solid var(--color-border);text-align:center}
.auth-helper p{font-size:12px;color:var(--color-ink-muted)}
.auth-hint{position:fixed;bottom:16px;left:0;right:0;text-align:center;font-size:11px;color:var(--color-ink-muted);opacity:.5;pointer-events:none}
/* Chat list */
.chat-list{height:100%;display:flex;flex-direction:column;background:var(--color-surface)}
.chat-list-header{display:flex;align-items:center;justify-content:space-between;padding:16px;background:var(--color-surface-2);border-bottom:1px solid var(--color-border);flex-shrink:0}
.header-title{font-size:20px;font-weight:700}
.header-right{display:flex;align-items:center;gap:12px}
.conversation-list{flex:1;overflow-y:auto}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:48px 24px;color:var(--color-ink-muted);text-align:center}
.empty-state svg{width:48px;height:48px;opacity:.4}
/* Search bar */
.search-bar{position:relative;display:flex;align-items:center}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--color-ink-muted);pointer-events:none}
.search-input{width:180px;padding:8px 36px 8px 38px;background:var(--color-surface-2);border:1px solid var(--color-border);border-radius:var(--radius-md);color:var(--color-ink);font-size:14px;outline:none;transition:all .2s}
.search-input:focus{border-color:var(--color-accent);box-shadow:0 0 0 3px rgba(108,92,231,.15)}
.search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--color-ink-muted);padding:4px;cursor:pointer;display:flex}
.search-clear svg{width:16px;height:16px}
/* Chat item */
.chat-item{width:100%;display:flex;align-items:center;gap:14px;padding:14px 16px;background:transparent;border:none;border-bottom:1px solid var(--color-border);cursor:pointer;transition:background .2s;text-align:left}
.chat-item:hover,.chat-item:active{background:var(--color-surface-2)}
.chat-avatar{position:relative;flex-shrink:0}
.online-indicator{position:absolute;bottom:0;right:0;width:14px;height:14px;background:var(--color-success);border:2px solid var(--color-surface);border-radius:50%;animation:onlinePulse 2s ease-in-out infinite}
.chat-info{flex:1;min-width:0}
.chat-header-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
.chat-name{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-time{font-size:11px;color:var(--color-ink-muted);flex-shrink:0;margin-left:8px}
.chat-preview-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chat-preview{font-size:14px;color:var(--color-ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.chat-preview.mine{color:var(--color-ink)}
.unread-badge{min-width:20px;height:20px;padding:0 6px;background:var(--color-accent);color:#fff;font-size:11px;font-weight:700;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chevron{width:20px;height:20px;color:var(--color-ink-muted);opacity:.5;margin-left:4px}
/* Chat screen */
.chat-screen{height:100%;display:flex;flex-direction:column;background:var(--color-surface)}
.chat-header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--color-surface-2);border-bottom:1px solid var(--color-border);flex-shrink:0}
.back-btn{display:flex;align-items:center;justify-content:center;width:36px;height:36px;background:var(--color-surface-3);border:none;border-radius:50%;color:var(--color-ink);cursor:pointer;transition:all .2s}
.back-btn:hover{background:var(--color-border)}
.back-btn svg{width:20px;height:20px}
.chat-header-info{flex:1;margin-left:4px}
.chat-header-info .chat-header-row{display:flex;align-items:center;gap:8px}
.status-badge{display:flex;align-items:center;gap:4px;font-size:12px}
.status-badge.online{color:var(--color-success)}
.status-badge.offline{color:var(--color-ink-muted)}
.status-dot{width:8px;height:8px;background:var(--color-success);border-radius:50%;animation:onlinePulse 2s ease-in-out infinite}
.header-action{display:flex;align-items:center;justify-content:center;width:36px;height:36px;background:transparent;border:none;color:var(--color-ink-muted);cursor:pointer;border-radius:50%;transition:all .2s}
.header-action:hover{background:var(--color-surface-3);color:var(--color-ink)}
.header-action svg{width:24px;height:24px}
.chat-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:4px}
.empty-chat{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;height:100%;color:var(--color-ink-muted);text-align:center}
.empty-chat svg{width:48px;height:48px;opacity:.4}
.message-group{display:flex;flex-direction:column;gap:2px}
.date-separator{display:flex;align-items:center;justify-content:center;margin:12px 0}
.date-separator span{font-size:11px;color:var(--color-ink-muted);background:var(--color-surface-2);padding:4px 12px;border-radius:10px;border:1px solid var(--color-border)}
.message-wrapper{display:flex;flex-direction:column;max-width:75%;animation:messageIn .2s ease-out}
.message-wrapper.sent{align-self:flex-end;align-items:flex-end}
.message-wrapper.received{align-self:flex-start;align-items:flex-start}
.message-bubble{padding:10px 14px;border-radius:20px;background:var(--color-surface-3);color:var(--color-ink);word-wrap:break-word}
.message-wrapper.sent .message-bubble{background:var(--color-accent);color:#fff}
.message-bubble p{font-size:15px;line-height:1.4}
.message-time{display:flex;align-items:center;gap:4px;font-size:11px;margin-top:2px}
.message-time.sent-time{color:rgba(255,255,255,.7);justify-content:flex-end}
.message-time.received-time{color:var(--color-ink-muted)}
.read-indicator svg{width:14px;height:14px}
.chat-input-area{padding:12px 16px;background:var(--color-surface-2);border-top:1px solid var(--color-border);flex-shrink:0}
.msg-input-wrapper{display:flex;align-items:flex-end;gap:8px;background:var(--color-surface-3);border-radius:var(--radius-xl);padding:4px 4px 4px 16px;border:1px solid var(--color-border);transition:border-color .2s}
.msg-input-wrapper:focus-within{border-color:var(--color-accent)}
.message-input{flex:1;background:transparent;border:none;color:var(--color-ink);font-size:15px;font-family:inherit;resize:none;outline:none;min-height:24px;max-height:100px;line-height:1.4}
.message-input::placeholder{color:var(--color-ink-muted)}
.send-btn{display:flex;align-items:center;justify-content:center;width:36px;height:36px;background:var(--color-accent);border:none;border-radius:50%;color:#fff;cursor:pointer;transition:all .2s;flex-shrink:0}
.send-btn:hover:not(:disabled){background:#5b4bd6;transform:scale(1.05)}
.send-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.send-btn svg{width:20px;height:20px}
/* Footer */
.app-footer{padding:12px 16px;background:var(--color-surface-2);border-top:1px solid var(--color-border)}
.footer-content{display:flex;justify-content:space-between;align-items:center}
.footer-content span{font-size:12px;color:var(--color-ink-muted)}
.logout-btn{display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--color-danger);font-size:13px;cursor:pointer;padding:6px 12px;border-radius:var(--radius-sm);transition:all .2s}
.logout-btn:hover{background:rgba(255,107,107,.1)}
.logout-btn svg{width:16px;height:16px}
</style>
</head>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

/* ---------- date helpers ---------- */
const fmtTime = (d) => { const dt=new Date(d); let h=dt.getHours(); const m=String(dt.getMinutes()).padStart(2,'0'); const ap=h>=12?'PM':'AM'; h=h%12||12; return `${h}:${m} ${ap}`; };
const fmtRelative = (d) => {
  const diff = Math.floor((Date.now()-new Date(d).getTime())/1000);
  if(diff<60) return 'just now';
  if(diff<3600) return `${Math.floor(diff/60)}m ago`;
  if(diff<86400) return `${Math.floor(diff/3600)}h ago`;
  return `${Math.floor(diff/86400)}d ago`;
};
const fmtDateSep = (d) => {
  const dt=new Date(d); const today=new Date();
  if(dt.toDateString()===today.toDateString()) return fmtTime(d);

  if(dt.toDateString()===y.toDateString()) return 'Yesterday';
  return dt.toLocaleDateString(undefined,{month:'short',day:'numeric'});

/* ================= ICONS ================= */
const Ico = ({d, ...p}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" {...p}>{d}</svg>;
/* ================= LOCK SCREEN ================= */
function LockScreen({ email, onUnlock }){
  const [passcode,setPasscode]=useState('');
  const [attempts,setAttempts]=useState(0);

  useEffect(()=>{ setPasscode(''); setAttempts(0); setError(null); },[email]);
  const handleUnlock = async () => {

    setLoading(true); setError(null);
    await new Promise(r=>setTimeout(r,800));
    if(validatePasscode(email,passcode)){ setLoading(false); onUnlock(); }
    else{
      setLoading(false);
      const next=attempts+1; setAttempts(next);

      else setError('Incorrect private passcode. Please try again.');

  };
  return (
    <div className="lock-screen">
      <div className="lock-content">
        <div className="lock-icon-wrapper">
          <svg className="lock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5">
            <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            <circle cx="12" cy="16" r="1" fill="currentColor"/>
          </svg>
        </div>
        <h1 className="lock-title">PRIVATE SPACE</h1>
        <p className="lock-subtitle">Enter your private passcode</p>
        <div className="passcode-display">
          {[0,1,2,3,4,5].map(i=><div key={i} className={"passcode-dot"+(passcode.length>i?" filled":"")}/>)}
        </div>
        <input type="password" className="passcode-input" value={passcode} inputMode="numeric"
          placeholder="• • • • • •" maxLength={6} autoComplete="one-time-code"
          onChange={e=>{ if(/^[0-9]*$/.test(e.target.value)&&e.target.value.length<=6) setPasscode(e.target.value); }}
          onKeyDown={e=>{ if(e.key==='Enter') handleUnlock(); }} />
        <button className="btn btn-primary unlock-btn" onClick={handleUnlock} disabled={passcode.length!==6||loading}>
          {loading ? <span className="btn-loading"><svg className="spinner" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" strokeWidth="3" strokeDasharray="31.4 31.4" strokeLinecap="round"/></svg>Verifying...</span> : 'Unlock Private Space'}
        </button>
        {attempts>0 && attempts<3 && <p className="attempt-warning">{3-attempts} attempt(s) remaining</p>}
        {error && <p className="error-message">{error}</p>}
        <p className="security-note">Protected by two-layer authentication</p>
      </div>
    </div>
  );
}
/* ================= AUTH SCREEN ================= */
function AuthScreen({ onLoggedIn }){
  const [email,setEmail]=useState('');
  const [password,setPassword]=useState('');
  const [showPw,setShowPw]=useState(false);
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState(null);
  const submit = async (e) => {
    e.preventDefault(); setError(null);
    if(!email.trim()){ setError('Please enter your email address'); return; }
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ setError('Please enter a valid email address'); return; }
    if(!password){ setError('Please enter your password'); return; }
    setLoading(true);
    await new Promise(r=>setTimeout(r,1000));
    const user = MOCK_USERS[email.toLowerCase().trim()];
    if(!user){ setLoading(false); setError('No account found with this email'); return; }
    if(password!=='password123'){ setLoading(false); setError('Incorrect password'); return; }
    setLoading(false);
    onLoggedIn(user);
  };
  return (
    <div className="auth-screen">
      <div className="auth-content">
        <div className="auth-header">
          <div className="auth-logo">
            <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" strokeWidth="2">
              <rect x="6" y="16" width="36" height="24" rx="4"/><path d="M14 16V10a6 6 0 0 1 12 0v6"/>
              <circle cx="24" cy="32" r="3" fill="currentColor"/><path d="M18 28c0-3.3 2.7-6 6-6s6 2.7 6 6" strokeLinecap="round"/>
            </svg>
          </div>
          <h1 className="auth-title">Private Space</h1>
          <p className="auth-subtitle">Sign in to your private messaging</p>
        </div>
        <div className="divider"></div>
        <form className="auth-form" onSubmit={submit}>
          <div className="form-group">
            <label className="form-label" htmlFor="email">Email Address</label>
            <input id="email" type="email" className="input-field" placeholder="you@example.com"
              value={email} onChange={e=>setEmail(e.target.value)} disabled={loading} autoComplete="email"/>
          </div>
          <div className="form-group">
            <div className="label-row"><label className="form-label" htmlFor="password">Password</label></div>
            <div className="input-wrapper">
              <input id="password" type={showPw?'text':'password'} className="input-field" placeholder="Enter your password"
                value={password} onChange={e=>setPassword(e.target.value)} disabled={loading} autoComplete="current-password"/>
              <button type="button" className="toggle-pw" onClick={()=>setShowPw(!showPw)} disabled={!password||loading} aria-label="Toggle password">
                {showPw
                  ? <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 2 12a9.09 9.09 0 0 1 4.24 7.94"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                  : <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>}
              </button>
            </div>
          </div>
          <div className="form-options">
            <label className="checkbox-label"><input type="checkbox" className="checkbox" disabled/><span className="checkbox-text">Remember this device</span></label>
            <button type="button" className="link-btn sm">Forgot password?</button>
          </div>
          <button type="submit" className="btn btn-primary submit-btn" disabled={loading}>
            {loading ? <span className="btn-loading"><svg className="spinner" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" strokeWidth="3" strokeDasharray="31.4 31.4" strokeLinecap="round"/></svg>Signing in...</span> : 'Sign In'}
          </button>
          {error && <div className="error-banner"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>{error}</div>}
        </form>
        <div className="auth-helper"><p>Access requires: Email verification + Private passcode</p></div>
      </div>
      <div className="auth-hint">
        <p>Demo: divyansh@private.space / partner@private.space</p>
        <p>Password: password123 · Passcode: div123 / part456</p>
      </div>
    </div>
  );
}
/* ================= SEARCH BAR ================= */
function SearchBar({ value, onChange, placeholder }){
  return (
    <div className="search-bar">
      <svg className="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input className="search-input" value={value} placeholder={placeholder} onChange={e=>onChange(e.target.value)}/>
      {value && <button className="search-clear" onClick={()=>onChange('')}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>}
    </div>
  );
}
/* ================= CHAT ITEM ================= */
function ChatItem({ conv, currentUserId, isOnline, onOpen }){
  const lm = conv.lastMessage;
  const mine = lm && lm.senderId===currentUserId;
  return (
    <button className="chat-item" onClick={onOpen}>
      <div className="chat-avatar">
        <div className="avatar-ring"><div className="avatar-placeholder" style={{width:48,height:48,fontSize:20}}>{conv.otherUser.displayName[0].toUpperCase()}</div></div>
        {isOnline && <span className="online-indicator"></span>}
      </div>
      <div className="chat-info">
        <div className="chat-header-row">
          <span className="chat-name">{conv.otherUser.displayName}</span>
          <span className="chat-time">{lm?fmtRelative(lm.createdAt):''}</span>
        </div>
        <div className="chat-preview-row">
          <span className={"chat-preview"+(mine?" mine":"")}>{lm?lm.content:'Start a conversation'}</span>
          {conv.unreadCount>0 && <span className="unread-badge">{conv.unreadCount}</span>}
        </div>
      </div>
      <svg className="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  );
}
/* ================= CHAT LIST ================= */
function ChatList({ currentUser, onOpenChat, onLogout }){
  const [query,setQuery]=useState('');
  const conversations = getConversationsForUser(currentUser.id)
    .filter(c=>c.otherUser.displayName.toLowerCase().includes(query.toLowerCase()));
  return (
    <div className="app">
      <div className="chat-list">
        <header className="chat-list-header">
          <h1 className="header-title">Messages</h1>
          <div className="header-right">
            <SearchBar value={query} onChange={setQuery} placeholder="Search..."/>
            <div className="avatar-ring"><div className="avatar-placeholder" style={{width:32,height:32,fontSize:14}}>{currentUser.displayName[0].toUpperCase()}</div></div>
          </div>
        </header>
        <div className="conversation-list">
          {conversations.length===0
            ? <div className="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V9a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><p>No conversations found</p></div>
            : conversations.map(c=>{
                const online = c.otherUser.displayName==='Partner';
                return <ChatItem key={c.id} conv={c} currentUserId={currentUser.id} isOnline={online}
                  onOpen={()=>onOpenChat({ conversationId:c.id, otherUserName:c.otherUser.displayName, isOnline:online })}/>;
              })}
        </div>
      </div>
      <div className="app-footer">
        <div className="footer-content">
          <span>Signed in as {currentUser.displayName}</span>
          <button className="logout-btn" onClick={onLogout}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Sign out
          </button>
        </div>
      </div>
    </div>
  );
}
/* ================= CHAT SCREEN ================= */
function ChatScreen({ conversationId, otherUserName, isOnline, currentUser, onBack }){
  const [messages,setMessages]=useState([]);
  const [text,setText]=useState('');
  const [sending,setSending]=useState(false);
  const endRef=useRef(null); const inputRef=useRef(null);
  useEffect(()=>{ setMessages(MOCK_MESSAGES[conversationId]||[]); },[conversationId]);
  useEffect(()=>{ endRef.current&&endRef.current.scrollIntoView({behavior:'smooth'}); },[messages]);
  const send = async () => {
    const c=text.trim(); if(!c) return;
    setSending(true); await new Promise(r=>setTimeout(r,400));
    setMessages(p=>[...p,{ id:'msg_'+Date.now(), senderId:currentUser.id, content:c, createdAt:new Date().toISOString() }]);
    setText(''); setSending(false); inputRef.current&&inputRef.current.focus();
  };
  return (
    <div className="app">
      <div className="chat-screen">
        <header className="chat-header">
          <button className="back-btn" onClick={onBack}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="15 18 9 12 15 6"/></svg></button>
          <div className="avatar-ring"><div className="avatar-placeholder" style={{width:36,height:36,fontSize:16}}>{otherUserName[0].toUpperCase()}</div></div>
          <div className="chat-header-info">
            <div className="chat-header-row">
              <span className="chat-name">{otherUserName}</span>
              <span className={"status-badge "+(isOnline?'online':'offline')}>
                {isOnline ? <span className="status-dot"></span> : <span>Last seen today at 4:32 PM</span>}
              </span>
            </div>
          </div>
          <button className="header-action"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg></button>
        </header>
        <div className="chat-messages">
          {messages.length===0
            ? <div className="empty-chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V9a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><p>No messages yet. Say hello!</p></div>
            : messages.map((m,i)=>{
                const sent = m.senderId===currentUser.id;
                const prev = messages[i-1];
                const showDate = !prev || fmtDateSep(prev.createdAt)!==fmtDateSep(m.createdAt);
                return (
                  <div className="message-group" key={m.id}>
                    {showDate && <div className="date-separator"><span>{fmtDateSep(m.createdAt)}</span></div>}
                    <div className={"message-wrapper "+(sent?'sent':'received')}>
                      <div className="message-bubble"><p>{m.content}</p></div>
                      <div className={"message-time "+(sent?'sent-time':'received-time')}>
                        <span>{fmtTime(m.createdAt)}</span>
                        {sent && <span className="read-indicator"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></span>}
                      </div>
                    </div>
                  </div>
                );
              })}
          <div ref={endRef}/>
        </div>
        <div className="chat-input-area">
          <div className="msg-input-wrapper">
            <textarea ref={inputRef} className="message-input" rows="1" placeholder="Type a message..."
              value={text} onChange={e=>setText(e.target.value)}
              onKeyDown={e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(); } }}/>
            <button className="send-btn" onClick={send} disabled={!text.trim()||sending}>
              {sending ? <svg className="spinner-sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" strokeWidth="3" strokeDasharray="31.4 31.4" strokeLinecap="round"/></svg>
                       : <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}
/* ================= APP (two-layer flow) ================= */
function App(){
  // screen: 'auth' -> 'passcode' -> 'chat'
  const [screen,setScreen]=useState('auth');
  const [currentUser,setCurrentUser]=useState(null);
  const [selectedChat,setSelectedChat]=useState(null);
  const handleLoggedIn = (user) => { setCurrentUser(user); setScreen('passcode'); };
  const handlePasscode = () => { setScreen('chat'); };
  const handleLogout = () => { setCurrentUser(null); setSelectedChat(null); setScreen('auth'); };
  if(screen==='auth') return <AuthScreen onLoggedIn={handleLoggedIn}/>;
  if(screen==='passcode') return <LockScreen email={currentUser?currentUser.email:''} onUnlock={handlePasscode}/>;
  // chat
  if(selectedChat){
    return <ChatScreen {...selectedChat} currentUser={currentUser} onBack={()=>setSelectedChat(null)}/>;
  }
  return <ChatList currentUser={currentUser} onOpenChat={setSelectedChat} onLogout={handleLogout}/>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
